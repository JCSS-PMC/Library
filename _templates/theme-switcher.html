{# Use a separate class to avoid the upstream light/dark/automatic cycle. #}
<button type="button" class="btn btn-sm nav-link pst-navbar-icon library-theme-switch pst-js-only"
        aria-label="Switch to dark mode" title="Switch to dark mode">
  <i class="fa-solid fa-moon fa-lg" data-library-theme-icon="dark" aria-hidden="true"></i>
  <i class="fa-solid fa-sun fa-lg" data-library-theme-icon="light" aria-hidden="true" hidden></i>
</button>
